<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Created Successfully</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f7fb;
        }

        .success-card {
            max-width: 600px;
            margin: 100px auto;
            border: none;
            border-radius: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card success-card shadow">

        <div class="card-body text-center p-5">

            <div style="font-size: 60px;">
                ✅
            </div>

            <h1 class="text-success mt-3">
                Job Created Successfully!
            </h1>

            <p class="text-muted mt-3">
                Your job description has been saved successfully.
            </p>

            <div class="mt-4">

                <a
                    href="{% url 'create_job_description' %}"
                    class="btn btn-primary me-2"
                >
                    Add Another Job
                </a>

                <a
                    href="{% url 'screening' %}"
                    class="btn btn-success"
                >
                    Start Screening
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>

    <style>
        body {

            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 100px auto;
            background: white;
            padding: 40px;

            border-radius: 12px;

        }

            color: #28a745;
        }
